services:
  app:
    image: chrome
    networks:
      - traefik
    container_name: chrome
    shm_size: 2g
    security_opt:
      - seccomp:unconfined
    # Optional: persist the runtime user's home (chrome profile, extensions,
    # history, dotfiles). UID/GID auto-adjusted at startup to match host owner.
    # volumes:
    #   - ./home:/home/zzci
    # Override UID/GID explicitly (skip auto-detection):
    # environment:
    #   - PUID=1000
    #   - PGID=1000
    # Host GPU passthrough: KasmVNC hardware 3D (-hw3d) and VA-API stream
    # encoding, plus Chrome GPU rasterization and VA-API video decode.
    # No group_add needed — the runtime user is joined to the device's own
    # gid at startup.
    # Comment out (or set GPU=off) on a host without /dev/dri.
    devices:
      - /dev/dri:/dev/dri

networks:
  traefik:
    external: true
    name: traefik
